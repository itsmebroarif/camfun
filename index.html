<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloGesture Engine - Exhibition</title>
    <!-- Tailwind CSS for UI Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP for UI Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-magenta: #ff00ea;
            --dark-bg: #030305;
            --grid-color: rgba(0, 243, 255, 0.05);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            color: var(--neon-blue);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        /* Animated Grid Background */
        .hologrid {
            position: absolute;
            top: 0;
            left: 0;
            width: 200vw;
            height: 200vh;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 15s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(60px) translateZ(-200px); }
        }

        /* Main Render Canvas */
        #holo-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Video Webcam Styles & Themes */
        #webcam-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #webcam {
            transform: scaleX(-1);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            filter: contrast(1.1) saturate(1.1) brightness(0.8);
            transition: filter 0.5s ease;
            object-fit: cover;
        }

        /* --- THEME CLASSES --- */
        .theme-bw { filter: grayscale(100%) contrast(1.3) !important; }
        .theme-negative { filter: invert(100%) hue-rotate(180deg) !important; }
        .theme-sepia { filter: sepia(100%) contrast(1.1) brightness(0.9) !important; }
        .theme-rainbow { animation: rainbow-shift 4s linear infinite !important; }
        
        @keyframes rainbow-shift {
            0% { filter: hue-rotate(0deg) saturate(1.5); }
            100% { filter: hue-rotate(360deg) saturate(1.5); }
        }

        .theme-vhs { filter: contrast(1.5) brightness(1.1) saturate(1.3) sepia(0.3) !important; }
        .theme-vhs::after {
            content: ""; position: absolute; inset: 0;
            background-image: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px; pointer-events: none;
            animation: vhs-scanlines 0.2s linear infinite; z-index: 2; opacity: 0.5;
        }
        @keyframes vhs-scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        .theme-vignette {
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }

        /* --- TADC ABSTRACTION THEME --- */
        .theme-tadc { 
            animation: tadc-glitch 0.3s infinite steps(2) !important; 
        }
        @keyframes tadc-glitch {
            0% { 
                filter: contrast(2) saturate(3) hue-rotate(0deg) brightness(1.2); 
                transform: scaleX(-1) translate(0px, 0px) scale(1.02);
            }
            25% { 
                filter: contrast(2.5) saturate(4) hue-rotate(45deg) brightness(1.5) invert(0.1); 
                transform: scaleX(-1) translate(3px, -2px) scale(1.04);
            }
            50% { 
                filter: contrast(3) saturate(5) hue-rotate(90deg) brightness(1.1); 
                transform: scaleX(-1) translate(-3px, 3px) scale(1.01);
            }
            75% { 
                filter: contrast(2) saturate(4) hue-rotate(-45deg) brightness(1.4) sepia(0.5); 
                transform: scaleX(-1) translate(2px, 2px) scale(1.03);
            }
            100% { 
                filter: contrast(2) saturate(3) hue-rotate(0deg) brightness(1.2); 
                transform: scaleX(-1) translate(0px, 0px) scale(1.02);
            }
        }

        /* HUD Styling */
        .hud-panel {
            background: rgba(3, 3, 5, 0.7);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
            backdrop-filter: blur(5px);
            z-index: 20;
        }

        .hud-text { text-shadow: 0 0 5px var(--neon-blue); }
        .hud-text-alert { color: var(--neon-magenta); text-shadow: 0 0 5px var(--neon-magenta); }

        /* Custom UI Elements */
        input[type=range], select, input[type=checkbox], button { accent-color: var(--neon-blue); }
        
        button.action-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            transition: all 0.2s;
        }
        button.action-btn:hover { background: var(--neon-blue); color: var(--dark-bg); box-shadow: 0 0 10px var(--neon-blue); }
        button.action-btn:active { transform: scale(0.95); }

        select {
            background-color: rgba(0, 0, 0, 0.5); color: var(--neon-blue);
            border: 1px solid var(--neon-blue); padding: 4px;
            border-radius: 4px; font-family: 'Share Tech Mono', monospace; font-size: 0.8rem;
            width: 100%;
        }
        select:focus { outline: none; box-shadow: 0 0 10px var(--neon-blue); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
            background: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue);
            cursor: pointer; margin-top: -5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer;
            background: rgba(0, 243, 255, 0.2); border-radius: 2px;
        }

        /* INTRO SCREEN (Exhibition Mode) */
        #intro-screen {
            position: absolute; inset: 0; background: #000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .intro-title {
            font-size: 4rem; letter-spacing: 0.2em; text-align: center;
            color: transparent; -webkit-text-stroke: 1px var(--neon-blue);
            text-shadow: 0 0 20px rgba(0,243,255,0.4); margin-bottom: 0.5rem;
        }
        
        .intro-subtitle {
            font-size: 1.2rem; color: var(--neon-magenta); letter-spacing: 0.3em;
            margin-bottom: 3rem; text-shadow: 0 0 10px var(--neon-magenta);
        }

        .author-text {
            position: absolute; bottom: 2rem; font-size: 0.9rem;
            color: rgba(255,255,255,0.5); letter-spacing: 0.1em;
        }

        .start-btn {
            padding: 15px 40px; font-size: 1.2rem; font-family: inherit;
            background: transparent; color: var(--neon-blue);
            border: 2px solid var(--neon-blue); cursor: pointer;
            letter-spacing: 2px; transition: 0.3s;
            box-shadow: 0 0 15px rgba(0,243,255,0.2), inset 0 0 15px rgba(0,243,255,0.1);
        }
        .start-btn:hover {
            background: var(--neon-blue); color: #000;
            box-shadow: 0 0 30px var(--neon-blue); transform: scale(1.05);
        }

        /* Loading Overlay */
        #loading {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 90;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .loader-ring {
            width: 80px; height: 80px; border: 3px solid transparent;
            border-top-color: var(--neon-blue); border-bottom-color: var(--neon-magenta);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Exhibition Intro Screen -->
    <div id="intro-screen">
        <div class="hologrid" style="z-index: -1; opacity: 0.3;"></div>
        <h1 class="intro-title">HOLOGESTURE</h1>
        <h2 class="intro-subtitle">SPATIAL COMPUTING ENGINE</h2>
        
        <button id="btn-start" class="start-btn">INITIALIZE SYSTEM</button>
        
        <div class="author-text">CREATED BY ARIF ALEXANDER</div>
    </div>

    <div class="hologrid"></div>
    
    <!-- Webcam Video Container -->
    <div id="webcam-container">
        <!-- We will start video after user interaction to respect browser autoplay policies -->
        <video id="webcam" playsinline></video>
    </div>
    
    <canvas id="holo-canvas"></canvas>

    <!-- Loading Overlay -->
    <div id="loading">
        <div class="loader-ring mb-4"></div>
        <p class="text-sm mt-2 text-cyan-400 tracking-widest" id="loading-status">Booting Neural Network...</p>
    </div>

    <!-- Top Left HUD -->
    <div class="absolute top-4 left-4 p-4 w-72 hud-panel rounded-lg flex flex-col gap-2 pointer-events-auto hidden" id="main-hud">
        <h2 class="text-xl font-bold border-b border-cyan-500 pb-2 mb-1 tracking-wider">SYSTEM STATUS</h2>
        
        <div class="flex justify-between text-sm"><span>FPS:</span> <span id="ui-fps" class="hud-text">00.0</span></div>
        <div class="flex justify-between text-sm"><span>TRACKING:</span> <span id="ui-tracking" class="hud-text-alert">OFFLINE</span></div>
        
        <!-- Object Spawner Section -->
        <div class="mt-2 border-t border-cyan-800 pt-3">
            <h3 class="text-[10px] text-cyan-500 mb-2 font-bold tracking-widest">HOLO-OBJECTS (PINCH TO GRAB)</h3>
            <div class="grid grid-cols-3 gap-2">
                <button id="btn-spawn-box" class="action-btn px-2 py-1 rounded text-xs font-bold">BOX</button>
                <button id="btn-spawn-circle" class="action-btn px-2 py-1 rounded text-xs font-bold">CIRCLE</button>
                <button id="btn-spawn-tri" class="action-btn px-2 py-1 rounded text-xs font-bold">POLY</button>
            </div>
        </div>

        <div class="mt-2 border-t border-cyan-800 pt-2 flex gap-4">
            <div class="flex-1">
                <h3 class="text-[10px] text-cyan-500 mb-1">L-HAND</h3>
                <div class="text-xs font-bold" id="ui-l-state">IDLE</div>
            </div>
            <div class="flex-1">
                <h3 class="text-[10px] text-cyan-500 mb-1">R-HAND</h3>
                <div class="text-xs font-bold" id="ui-r-state">IDLE</div>
            </div>
        </div>
    </div>

    <!-- Bottom Right Settings Panel -->
    <div class="absolute bottom-4 right-4 p-4 w-72 hud-panel rounded-lg flex flex-col gap-3 transition-transform origin-bottom-right pointer-events-auto hidden" id="settings-panel">
        <div class="flex justify-between items-center border-b border-cyan-500 pb-2">
            <h2 class="text-md font-bold tracking-wider">CALIBRATION</h2>
            <button id="btn-toggle-settings" class="text-[10px] border border-cyan-500 px-2 py-1 rounded hover:bg-cyan-900 transition-colors">HIDE</button>
        </div>
        
        <div class="flex flex-col gap-1">
            <label class="text-[10px] text-cyan-500">VISUAL THEME</label>
            <select id="sel-theme">
                <option value="holo">Holographic (Default)</option>
                <option value="tadc">TADC (Abstraction)</option>
                <option value="bw">Monochrome</option>
                <option value="vhs">Retro VHS</option>
                <option value="rainbow">RGB Shift</option>
                <option value="negative">Inverted</option>
            </select>
        </div>

        <div class="flex flex-col gap-1 border-t border-cyan-900 pt-2">
            <label class="text-xs flex justify-between"><span>Smoothing</span> <span id="val-smooth">0.25</span></label>
            <input type="range" id="sl-smooth" min="0.05" max="0.5" step="0.01" value="0.25">
        </div>
        
        <div class="flex flex-col gap-1">
            <label class="text-xs flex justify-between"><span>Pinch Sensitivity</span> <span id="val-pinch">0.07</span></label>
            <input type="range" id="sl-pinch" min="0.03" max="0.15" step="0.01" value="0.07">
        </div>
        
        <button id="btn-clear-objects" class="action-btn px-2 py-1 mt-1 rounded text-[10px] font-bold w-full">CLEAR ALL ENTITIES</button>
    </div>

    <button id="btn-show-settings" class="absolute bottom-4 right-4 hud-panel px-4 py-2 rounded-lg font-bold text-xs hidden hover:bg-cyan-900 transition-colors z-30 pointer-events-auto">
        SETTINGS
    </button>

    <script type="module">
        import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

        const CONFIG = {
            smoothing: 0.25,      // Higher = smoother but laggy, Lower = responsive but jittery
            pinchThreshold: 0.07, // AI Distance for pinch
            glowIntensity: 15,
            maxParticles: 80,     // Optimized for exhibition performance
            currentTheme: 'holo'
        };

        // 6 Nodes for complete hand wireframe
        const TRACKED_NODES = ['palm', 'thumb', 'index', 'middle', 'ring', 'pinky'];
        const MP_LANDMARKS = { palm: 0, thumb: 4, index: 8, middle: 12, ring: 16, pinky: 20 };

        const createHandState = () => {
            const state = { active: false, pinchDist: 0, isPinched: false, lastActive: 0, nodes: {} };
            TRACKED_NODES.forEach(n => state.nodes[n] = {x:0, y:0, z:0});
            return state;
        };

        const STATE = { left: createHandState(), right: createHandState(), handCount: 0 };
        const targets = { left: createHandState(), right: createHandState() }; // For smoothing interpolation

        const MathUtils = {
            lerp: (start, end, amt) => (1 - amt) * start + amt * end,
            dist: (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y), // Optimized
            dist3D: (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y, p2.z - p1.z),
            random: (min, max) => Math.random() * (max - min) + min
        };

        class ParticleSystem {
            constructor() { this.particles = []; }
            emit(x, y, color, count = 1, isShockwave = false) {
                if(this.particles.length >= CONFIG.maxParticles && !isShockwave) return;
                for(let i=0; i<count; i++) {
                    const angle = MathUtils.random(0, Math.PI * 2);
                    const speed = isShockwave ? MathUtils.random(3, 10) : MathUtils.random(0.5, 2);
                    this.particles.push({
                        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                        life: 1.0, decay: isShockwave ? 0.03 : 0.02, color, size: MathUtils.random(1, 3)
                    });
                }
            }
            updateAndDraw(ctx) {
                // Optimization: Don't set shadowBlur for particles to save GPU
                ctx.shadowBlur = 0; 
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                    if (p.life <= 0) { this.particles.splice(i, 1); continue; }
                    ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('rgb', 'rgba');
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                }
            }
        }
        const particles = new ParticleSystem();

        class HoloShape {
            constructor(type) {
                this.type = type;
                this.x = window.innerWidth / 2 + MathUtils.random(-100, 100);
                this.y = window.innerHeight / 2 + MathUtils.random(-100, 100);
                this.vx = MathUtils.random(-2, 2); this.vy = MathUtils.random(-2, 2);
                this.size = MathUtils.random(40, 70);
                this.rotation = 0; this.vrot = MathUtils.random(-0.03, 0.03);
                
                // TADC Mode colors or normal
                const isTADC = CONFIG.currentTheme === 'tadc';
                const colors = isTADC ? ['#ff0000', '#0000ff', '#ffff00'] : ['#00f3ff', '#ff00ea', '#00ff66'];
                this.color = colors[Math.floor(Math.random()*colors.length)];
                this.grabbedBy = null;
            }

            update() {
                if (this.grabbedBy) {
                    const hand = STATE[this.grabbedBy];
                    if (hand.active && hand.isPinched) {
                        const midX = (hand.nodes.index.x + hand.nodes.thumb.x) / 2;
                        const midY = (hand.nodes.index.y + hand.nodes.thumb.y) / 2;
                        this.x = MathUtils.lerp(this.x, midX, 0.4);
                        this.y = MathUtils.lerp(this.y, midY, 0.4);
                        this.vx = 0; this.vy = 0;
                        if(Math.random()>0.5) particles.emit(this.x, this.y, this.color, 1);
                        return;
                    } else {
                        this.grabbedBy = null; // Released
                    }
                }

                this.x += this.vx; this.y += this.vy; this.rotation += this.vrot;
                this.vx *= 0.99; this.vy *= 0.99; // Air friction

                // Bounce off walls
                if (this.x < this.size || this.x > window.innerWidth - this.size) this.vx *= -1;
                if (this.y < this.size || this.y > window.innerHeight - this.size) this.vy *= -1;

                // Hand Interaction
                ['left', 'right'].forEach(side => {
                    const hand = STATE[side];
                    if (!hand.active) return;

                    // Grab Check
                    if (hand.isPinched && !this.grabbedBy) {
                        const midX = (hand.nodes.index.x + hand.nodes.thumb.x) / 2;
                        const midY = (hand.nodes.index.y + hand.nodes.thumb.y) / 2;
                        if (MathUtils.dist({x: midX, y: midY}, this) < this.size + 20) {
                            this.grabbedBy = side;
                            particles.emit(this.x, this.y, this.color, 15, true);
                        }
                    }

                    // Push away from palm
                    if (!this.grabbedBy) {
                        const d = MathUtils.dist(hand.nodes.palm, this);
                        if (d < 100) {
                            const force = (100 - d) / 100;
                            const angle = Math.atan2(this.y - hand.nodes.palm.y, this.x - hand.nodes.palm.x);
                            this.vx += Math.cos(angle) * force * 1.5;
                            this.vy += Math.sin(angle) * force * 1.5;
                            this.vrot += force * 0.05;
                        }
                    }
                });
            }

            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.strokeStyle = this.color; ctx.lineWidth = 3;
                ctx.shadowBlur = this.grabbedBy ? 20 : 10; ctx.shadowColor = this.color;
                
                ctx.beginPath();
                if (this.type === 'box') {
                    ctx.rect(-this.size/2, -this.size/2, this.size, this.size);
                } else if (this.type === 'circle') {
                    ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                    if(CONFIG.currentTheme !== 'tadc') ctx.setLineDash([8, 4]); // Solid in TADC
                } else { // Triangle
                    ctx.moveTo(0, -this.size/2); ctx.lineTo(this.size/2, this.size/2); ctx.lineTo(-this.size/2, this.size/2); ctx.closePath();
                }
                ctx.stroke();

                if(this.grabbedBy) {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fill();
                }
                ctx.restore();
            }
        }
        const shapes = [];

        const UI = {
            video: document.getElementById('webcam'),
            canvas: document.getElementById('holo-canvas'),
            ctx: document.getElementById('holo-canvas').getContext('2d'),
            
            // HUD
            intro: document.getElementById('intro-screen'),
            loading: document.getElementById('loading'),
            mainHud: document.getElementById('main-hud'),
            settings: document.getElementById('settings-panel'),
            
            bindEvents() {
                // Exhibition Start
                document.getElementById('btn-start').addEventListener('click', () => {
                    gsap.to(UI.intro, { opacity: 0, duration: 0.5, onComplete: () => {
                        UI.intro.style.display = 'none';
                        UI.loading.style.display = 'flex';
                        initEngine(); // Start heavy lifting AFTER user clicks
                    }});
                });

                // Spawners
                document.getElementById('btn-spawn-box').addEventListener('click', () => shapes.push(new HoloShape('box')));
                document.getElementById('btn-spawn-circle').addEventListener('click', () => shapes.push(new HoloShape('circle')));
                document.getElementById('btn-spawn-tri').addEventListener('click', () => shapes.push(new HoloShape('triangle')));
                document.getElementById('btn-clear-objects').addEventListener('click', () => shapes.length = 0);

                // Settings
                const bindSlider = (id, valId, key) => {
                    document.getElementById(id).addEventListener('input', e => {
                        CONFIG[key] = parseFloat(e.target.value);
                        document.getElementById(valId).innerText = e.target.value;
                    });
                };
                bindSlider('sl-smooth', 'val-smooth', 'smoothing');
                bindSlider('sl-pinch', 'val-pinch', 'pinchThreshold');

                document.getElementById('btn-toggle-settings').addEventListener('click', () => {
                    UI.settings.classList.add('hidden');
                    document.getElementById('btn-show-settings').classList.remove('hidden');
                });
                document.getElementById('btn-show-settings').addEventListener('click', (e) => {
                    UI.settings.classList.remove('hidden');
                    e.target.classList.add('hidden');
                });

                document.getElementById('sel-theme').addEventListener('change', e => {
                    UI.video.className = ''; // reset
                    CONFIG.currentTheme = e.target.value;
                    if(CONFIG.currentTheme !== 'holo') UI.video.classList.add(`theme-${CONFIG.currentTheme}`);
                });
            },
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
        };
        window.addEventListener('resize', () => UI.resize());
        UI.resize(); UI.bindEvents();

        let handLandmarker = null;
        let lastVideoTime = -1;

        async function initEngine() {
            try {
                const status = document.getElementById('loading-status');
                status.innerText = "Activating Camera...";
                
                // Optimization: Request lower resolution for faster AI processing. 
                // Visuals will still be upscaled by CSS object-fit.
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" } 
                });
                UI.video.srcObject = stream;
                UI.video.play();

                status.innerText = "Loading Hand Tracking Models...";
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU" // Critical for performance
                    },
                    runningMode: "VIDEO",
                    numHands: 2,
                    minHandDetectionConfidence: 0.5, // Lowered slightly for faster lock-on
                    minHandPresenceConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                // Boot complete
                gsap.to(UI.loading, { opacity: 0, duration: 0.5, onComplete: () => {
                    UI.loading.style.display = 'none';
                    UI.mainHud.classList.remove('hidden');
                    UI.settings.classList.remove('hidden');
                    document.getElementById('ui-tracking').innerText = "ONLINE";
                    document.getElementById('ui-tracking').className = "hud-text text-cyan-400";
                    
                    // Spawn intro shapes
                    shapes.push(new HoloShape('box'), new HoloShape('circle'));
                    
                    requestAnimationFrame(renderLoop);
                }});

            } catch (err) {
                console.error(err);
                document.getElementById('loading-status').innerText = "ERROR: " + err.message;
                document.getElementById('loading-status').classList.add("text-red-500");
            }
        }

        function processLandmarks(results) {
            const now = Date.now();
            STATE.handCount = results.handednesses.length;
            
            // Auto timeout if hand leaves frame
            if(now - STATE.left.lastActive > 100) STATE.left.active = false;
            if(now - STATE.right.lastActive > 100) STATE.right.active = false;

            if (results.landmarks) {
                results.landmarks.forEach((landmarks, index) => {
                    // Fix mirrored labeling
                    const classification = results.handednesses[index][0];
                    const handType = classification.categoryName === 'Left' ? 'right' : 'left'; 
                    const s = STATE[handType];
                    const t = targets[handType];
                    
                    s.active = true; s.lastActive = now;
                    
                    // Map 6 nodes
                    TRACKED_NODES.forEach(key => {
                        const lm = landmarks[MP_LANDMARKS[key]];
                        t.nodes[key] = { x: (1 - lm.x) * UI.canvas.width, y: lm.y * UI.canvas.height, z: lm.z };
                    });
                    
                    // Pinch Logic
                    const rawDist = MathUtils.dist3D(landmarks[MP_LANDMARKS.index], landmarks[MP_LANDMARKS.thumb]);
                    s.pinchDist = rawDist;
                    const wasPinched = s.isPinched;
                    s.isPinched = rawDist < CONFIG.pinchThreshold;

                    if(!wasPinched && s.isPinched) {
                        const midX = (s.nodes.index.x + s.nodes.thumb.x) / 2;
                        const midY = (s.nodes.index.y + s.nodes.thumb.y) / 2;
                        const color = handType === 'left' ? 'rgb(0, 243, 255)' : 'rgb(255, 0, 234)';
                        particles.emit(midX, midY, color, 12, true);
                    }
                });
            }

            // Interpolation for smooth UI
            ['left', 'right'].forEach(side => {
                const s = STATE[side];
                const t = targets[side];
                if(s.active) {
                    TRACKED_NODES.forEach(key => {
                        s.nodes[key].x = MathUtils.lerp(s.nodes[key].x, t.nodes[key].x, CONFIG.smoothing);
                        s.nodes[key].y = MathUtils.lerp(s.nodes[key].y, t.nodes[key].y, CONFIG.smoothing);
                    });
                }
            });
        }

        function drawBeam(ctx, p1, p2, color, thickness) {
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = color; ctx.lineWidth = thickness;
            ctx.shadowBlur = CONFIG.glowIntensity; ctx.shadowColor = color;
            ctx.stroke();
        }

        function renderHands(ctx) {
            ['left', 'right'].forEach(side => {
                const s = STATE[side];
                if (!s.active) return;

                const isTADC = CONFIG.currentTheme === 'tadc';
                
                // TADC Colors are harsh, Holo colors are neon
                let color, dimColor;
                if(isTADC) {
                    color = side === 'left' ? 'rgb(255, 255, 0)' : 'rgb(255, 0, 0)'; // Yellow / Red
                    dimColor = side === 'left' ? 'rgba(255, 255, 0, 0.5)' : 'rgba(255, 0, 0, 0.5)';
                } else {
                    color = side === 'left' ? 'rgb(0, 243, 255)' : 'rgb(255, 0, 234)'; // Cyan / Magenta
                    dimColor = side === 'left' ? 'rgba(0, 243, 255, 0.4)' : 'rgba(255, 0, 234, 0.4)';
                }
                
                // Draw Wireframe bones from palm to fingers
                ['thumb', 'index', 'middle', 'ring', 'pinky'].forEach(finger => {
                    const node = s.nodes[finger];
                    drawBeam(ctx, s.nodes.palm, node, dimColor, 1.5);
                    
                    // Node dot
                    ctx.beginPath(); ctx.arc(node.x, node.y, finger==='index'||finger==='thumb'? 4 : 2, 0, Math.PI*2);
                    ctx.fillStyle = '#fff'; ctx.shadowBlur = 5; ctx.shadowColor = color; ctx.fill();
                });

                // Pinch Connect Line
                drawBeam(ctx, s.nodes.index, s.nodes.thumb, color, s.isPinched ? 3 : 1);
                
                // Palm Core
                ctx.beginPath(); ctx.arc(s.nodes.palm.x, s.nodes.palm.y, 8, 0, Math.PI*2);
                ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();

                // UI Update
                const uiEl = side === 'left' ? document.getElementById('ui-l-state') : document.getElementById('ui-r-state');
                if(s.isPinched) {
                    uiEl.innerText = "GRABBING"; uiEl.className = "text-xs font-bold text-pink-500";
                } else {
                    uiEl.innerText = "TRACKING"; uiEl.className = "text-xs font-bold text-cyan-300";
                }
            });

            // Hand missing UI
            if(!STATE.left.active) document.getElementById('ui-l-state').innerHTML = `<span class="text-gray-600">LOST</span>`;
            if(!STATE.right.active) document.getElementById('ui-r-state').innerHTML = `<span class="text-gray-600">LOST</span>`;
        }

        let frameCount = 0; let lastTime = performance.now();

        function renderLoop() {
            // FPS Counter (optimized check)
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('ui-fps').innerText = frameCount;
                frameCount = 0; lastTime = now;
            }

            // AI Inference Trigger
            if (UI.video.currentTime !== lastVideoTime && handLandmarker) {
                lastVideoTime = UI.video.currentTime;
                const results = handLandmarker.detectForVideo(UI.video, now);
                processLandmarks(results);
            }

            // Render
            UI.ctx.clearRect(0, 0, UI.canvas.width, UI.canvas.height);
            UI.ctx.globalCompositeOperation = CONFIG.currentTheme === 'tadc' ? 'source-over' : 'lighter';

            shapes.forEach(shape => { shape.update(); shape.draw(UI.ctx); });
            renderHands(UI.ctx);
            particles.updateAndDraw(UI.ctx);

            requestAnimationFrame(renderLoop);
        }

    </script>
</body>
